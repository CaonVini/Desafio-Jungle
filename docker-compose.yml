services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering}
      POSTGRES_DB: ${DB_NAME:-wagering}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering} -d ${DB_NAME:-wagering}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Desde mar/2026 a tag "latest" exige LOCALSTACK_AUTH_TOKEN. Fixamos uma versão sem essa exigência.
    image: localstack/localstack:${LOCALSTACK_IMAGE_TAG:-4.12}
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(awslocal sqs list-queues | grep -c 000000000000)\" = \"3\" ]"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:


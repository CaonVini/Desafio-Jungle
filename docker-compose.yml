services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering}
      POSTGRES_DB: ${DB_NAME:-wagering}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wagering} -d ${DB_NAME:-wagering}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Desde mar/2026 a tag "latest" exige LOCALSTACK_AUTH_TOKEN. Fixamos uma versão sem essa exigência.
    image: localstack/localstack:${LOCALSTACK_IMAGE_TAG:-4.12}
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(awslocal sqs list-queues | grep -c 000000000000)\" = \"3\" ]"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    profiles: ["app"]
    command: ["bun", "run", "migration:run"]
    environment: &database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-wagering}
      DB_PASSWORD: ${DB_PASSWORD:-wagering}
      DB_NAME: ${DB_NAME:-wagering}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    profiles: ["app"]
    environment:
      <<: *database
      SQS_ENDPOINT: http://localstack:4566
      SQS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wagering-events
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
    deploy:
      replicas: ${APP_REPLICAS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: nginx:1.27-alpine
    container_name: wagering-gateway
    profiles: ["app"]
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:


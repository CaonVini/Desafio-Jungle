upstream wagering_api {
    server app:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://wagering_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
    }
}
